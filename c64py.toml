# c64py configuration file.
# Generated by `c64py --write-config`. CLI flags always override these values.
# See docs/config.md for the full schema and search order.

[video]
rendering = "per-cycle"  # Pygame sampling tier: "per-frame", "per-raster", or "per-cycle"
standard = "pal"  # Video timing standard: "pal" or "ntsc"
scale = 2  # Graphics window scale factor (integer)
fps = 30  # Graphics target FPS / max present rate
border = 32  # Graphics border size in pixels
fullscreen = false  # Hide debug panel / status bar (text mode) when true

[audio]
emulation = "resid"  # Audio backend: "resid", "python-sid", or "disabled"
volume = 1.0  # Master volume (0.0 = muted, 1.0 = full)
enable_resid = true

[emulation]
interface = "graphics"  # Interface mode: "textual", "headless", or "graphics"
disk_emulation = "accurate-rust"  # Disk emulation tier: "fast", "accurate-python", "accurate-rust"
vic_emulation = "accurate-rust"  # VIC timing tier: "fast", "accurate-python", "accurate-rust"

[debug]
turbo = false  # Run at maximum speed (no throttle)
udp_debug = false  # Emit debug events over UDP
screen_update_interval = 0.1  # Status/screen update interval in seconds
udp_port = 64738  # UDP port for debug events when udp_debug = true

[input]
[input.joystick]
[input.joystick.port1]

[input.joystick.port2]
up = ""
down = ""
left = ""
right = ""
fire = []

[input.gamepad]
axis_threshold = 0.5  # Default axis threshold (ports may override)


[input.gamepad.port1]
enabled = true  # Gamepad → emulated C64 joystick port 1
axis_threshold = 0.5  # Axis threshold for port 1


[input.gamepad.port1.mapping]
[input.gamepad.port1.mapping.up]
guid = "0300d71f7e0500000920000001006803"
token = "axis1-"

[input.gamepad.port1.mapping.down]
guid = "0300d71f7e0500000920000001006803"
token = "axis1+"

[input.gamepad.port1.mapping.left]
guid = "0300d71f7e0500000920000001006803"
token = "axis0-"

[input.gamepad.port1.mapping.right]
guid = "0300d71f7e0500000920000001006803"
token = "axis0+"

[input.gamepad.port1.mapping.fire]
guid = "0300d71f7e0500000920000001006803"
token = "button0"

[input.gamepad.port2]
enabled = false  # Gamepad → emulated C64 joystick port 2
axis_threshold = 0.5  # Axis threshold for port 2


[input.gamepad.port2.mapping]
up = ""
down = ""
left = ""
right = ""
fire = ""
