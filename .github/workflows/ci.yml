name: CI

# Run only on the canonical upstream repo; the same workflow file may exist on forks/clones
# without duplicating CI there (github.repository is the repo running the workflow).
# Run on main pushes and on PRs targeting main — not on every feature-branch push (avoids
# duplicate runs with pull_request). Draft PRs are skipped until marked ready for review.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  rust-core:
    if: github.repository == 'cyberplant/c64py' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (optional native core)
        run: cd rust/c64py-core && cargo test

  build:
    if: github.repository == 'cyberplant/c64py' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Install package (smoke test)
        run: |
          python -m pip install .
          python -c "import c64py; import c64py.emulator; print(c64py.__version__)"

      - name: Install ROM build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: Build ROMs from source
        run: |
          git clone --depth 1 https://github.com/mist64/c64rom.git /tmp/c64rom
          cd /tmp/c64rom && make
          mkdir -p $HOME/roms
          cp /tmp/c64rom/basic.bin $HOME/roms/basic.901226-01.bin
          cp /tmp/c64rom/kernal.bin $HOME/roms/kernal.901227-03.bin

      - name: Run emulator smoke test
        run: |
          python -m pip install -e .
          C64PY_ROM_DIR=$HOME/roms timeout 10 python C64.py --no-colors --max-cycles 3000000 --autoquit || true

